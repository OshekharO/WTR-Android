name: otaku_stream
description: OtakuStream — multi-source novel, manga and anime reader.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  cached_network_image: ^3.2.3
  flutter_cache_manager: ^3.4.1
  http: ^1.2.2
  shared_preferences: ^2.3.3
  logger: ^2.5.0
  google_nav_bar: ^5.0.7
  adaptive_theme: ^3.6.0
  responsive_framework: ^1.5.1
  nb_utils: ^7.1.4
  mix: ^2.0.3
  cloudflare_bypass: ^0.0.1
  cloudflare_interceptor: ^0.0.3
  dart_web_scraper: ^0.2.13
  flutter_cors_image: ^0.3.13
  photo_view: ^0.15.0
  chewie: ^1.14.1
  video_player: ^2.11.1
  dns_client: ^1.3.1
  cryptography: ^2.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/icons/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/icon.png"

  min_sdk_android: 21

  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/icon.png"

  web:
    generate: true
    image_path: "assets/icons/icon.png"
    background_color: "#FFFFFF"
    theme_color: "#FFFFFF"

  windows:
    generate: true
    image_path: "assets/icons/icon.png"
    icon_size: 48

  macos:
    generate: true
    image_path: "assets/icons/icon.png"
